  NodeIdWithoutNamespace:
    type: string
    pattern: "s=.*|g=.*|b=.*"
    description: |
      NodeId are automatically managed by the modeler. However in rare
      circumstances, you may want to specify a String NodeID. 
      You can specify a custom nodeId here,

      example:
        nodeId:  s=MyMachine
        nodeId:  b=1ABDFG==   # Base 64 binary nodeId

      Notes: 
        - the ns=...: part of the node Id shall not be provided. 
        - you do not need to use the nodeId property for numerical nodeId, as they are handled automatically
        - subsequent children of the node will also have a string nodeId derived from the parent nodeId. 
          for instance s=MyMachine-Child1


  BrowseName:
    type: string
    # The namespace-URI alternative is for NamespaceMetadata: OPC 10000-5 gives
    # that object the namespace URI itself as BrowseName, so the PascalCase
    # convention below cannot apply to it. A BrowseName's Name part is an
    # unrestricted String in OPC UA; the rest of this pattern is our convention:
    # PascalCase start (test LSC8), underscores allowed as DSL-E-NAMING-001 does,
    # so a published spec (Machinery's MachineryItemState_StateMachineType) is not
    # rejected by the editor. The prefix applies to a placeholder too: a type
    # redeclares its base type's ua:<OrderedObject>.
    pattern: "^(https?://\\S*$)|^([A-Za-z0-9]+:)?([A-Z][A-Za-z0-9_]*|<[A-Z][A-Za-z0-9_°#]*>)$"
    description: |
      In OPC UA, a browseName is a string that identifies a node within the address space of an OPC UA server. 
      It is used to navigate through the address space to locate a specific node. 
      The browseName is similar to a file name in a file system, and is unique within the parent node's namespace. 
      It is used in conjunction with the browsePath to access a specific node in the address space.

      A browseName is a string, and is typically composed of two parts: a namespace index and a name. 
      The namespace index identifies the namespace in which the browseName is defined, while the name is the actual name of the node. 

      For example, a browseName of "di:DeviceType" would have a namespace di (Device Integration) and a name of "DeviceType".

      This browseName, along with the path to the node's parent, can be used to construct a browsePath that can be used to access the temperature sensor node.

      Best practices:

       * use english terms and PascalCase Convention:
         for instance TemperatureSensor (OK) and not capteur_de_temperature (BAD).
       * there is no need to specify the namespace portion when the node browseName belongs to the namespace of the model under construction.
       * the namespace portion (the alias) must be specified when the node's browseName is defined in a external Namespace.
       * browseName that belongs to namespace=0, the standard OPC UA namespace must be prefixed by `ua:` . 
       * by default the root node is ua:/RootFolder, you can specify a different root node by refering to a element defined in this model by $<BrowseName>

  # It is worth noting that the browseName is different from the nodeId, which is a unique identifier assigned
  # to each node in the address space by the OPC UA server.
  # While the browseName is used to navigate the address space,
  # the nodeId is used to uniquely identify a node within the address space.

  BrowsePath:
    description: |
      A browsePath is a way to navigate through the address space of an OPC UA server 
      to locate a specific node. It is a string that defines the path of nodes to a 
      specific node, similar to a file path in a file system. The nodes in a browsePath 
      are separated by forward slashes, and each node is identified by its browseName.
      The browsePath can be used to access the value or other information of the node 
      at the end of the path.
      The browse path is typically a string of forward-slash-separated browse names,
      where each browse name identifies a node in the address space.

      For instance thje browse path for a temperature sensor node may be something like 

      "Objects/MyDevice/Sensors/Temperature". 
      This browse path consists of four nodes named "Objects", "MyDevice", "Sensors" and "Temperature". 
      Each of these nodes are identified by its browseName, "Objects", "MyDevice", "Sensors" and "Temperature" respectively.
    type: string
    # A browse path is one of:
    #   - anchor-only: $Robot1               ($<anchor> with no path segments)
    #   - anchored:    $Robot1/robotics:Axes  ($<anchor> followed by /segment(s))
    #   - absolute:    /ua:Objects/di:DeviceSet
    #   - relative:    MyInstance/Folder1
    # where each segment is an optional alias, then either a PascalCase name or a placeholder <…>.
    #
    # The alternation is:
    #   1. \\$[A-Za-z_][A-Za-z0-9_]*  — standalone anchor (e.g. $TemperatureSensor1)
    #   2. existing pattern            — anchored-with-path, absolute, or relative
    pattern: "^(\\$[A-Za-z_][A-Za-z0-9_]*|(\\$[A-Za-z_][A-Za-z0-9_]*\\/|\\/)?([A-Za-z0-9]+:)?(([A-Z][a-zA-Z0-9]*)|(<[^>]+>))(\\/([A-Za-z0-9]+:)?(([A-Z][a-zA-Z0-9]*)|(<[^>]+>)))*)$"

  #### ------------------------------------- Various way to represent a LocalizedText
  LocalizedTextSimple:
    type: string
    default: ""

  LocalizedTextFull:
    type: object
    properties:
      locale:
        type: [string, "null"]
      text:
        type: string
    required: [text]
    additionalProperties: false

  LocalizedText:
    oneOf:
      - $ref: "#/$defs/LocalizedTextFull"
      - $ref: "#/$defs/LocalizedTextSimple"

  #### ------------------------------------- EnumerationDefinition
  EnumerationDefinitionAsStringList:
    type: array
    items:
      type: string
    minItems: 1
    ## Duplicate member names are NOT rejected here, deliberately. The loader's own
    ## check reports them as `Duplicate enum field name: 'X'` with a line number
    ## (ERR-008-a), which is far more useful than the schema's generic "must NOT
    ## have duplicate items". While DataTypeBasic was an open catch-all a
    ## `uniqueItems` failure here was harmless — the catch-all still matched, so the
    ## document stayed schema-valid and reached that check. Now that the three
    ## flavours are closed, a `uniqueItems` failure would make the whole entry
    ## schema-invalid and pre-empt the better message.

  EnumerationField:
    type: object
    properties:
      value:
        type: number
      displayName:
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
      name:
        type: string
    required: [name]
    additionalProperties: false

  EnumerationDefinitionPrecise:
    type: array
    items:
      $ref: "#/$defs/EnumerationField"

  EnumerationDefinition:
    description: Enumeration definition
    oneOf:
      - $ref: "#/$defs/EnumerationDefinitionAsStringList"
      - $ref: "#/$defs/EnumerationDefinitionPrecise"

  EnumerationDefinition1:
    type: array
    items:
      type: string
    uniqueItems: true

  #### ------------------------------------- StructureDefinition
  StructureField:
    type: object
    properties:
      name:
        type: string
      dataType:
        $ref: "#/$defs/DataTypeRef"
      description:
        $ref: "#/$defs/LocalizedText"
      isOptional:
        type: boolean
        default: false
        description: specify if the field is a optional field
      allowSubTypes:
        type: boolean
        default: false
        description: >-
          the field may hold a subtype of its dataType (OPC 10000-3 8.51, NodeSet AllowSubTypes).
          Makes the structure a StructureWithSubtypedValues; do not combine with isOptional.

  #### ----------------------------------------- UANodes
  Role:
    type: object
    additionalProperties: false
    required: [browseName]
    ## typing for the shared documentation keys; the whitelist below closes the entry
    allOf:
      - $ref: "#/$defs/WithDocumentation"
    properties:
      browseName:
        $ref: "#/$defs/BrowseName"
      displayName:
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
      documentation: true
      specRef: true
      nodeId:
        type: string
      typeDefinition:
        description: RoleType, or a subtype of it. Defaults to ua:RoleType.
        type: string
      componentOf:
        description: Defaults to the server's RoleSet, /ua:Objects/ua:Server/ua:ServerCapabilities/ua:RoleSet.
        $ref: "#/$defs/BrowsePath"
      configurable:
        description: >
          false keeps Identities only, without the Applications/Endpoints lists and the
          methods that edit them. Defaults to true.
        type: boolean
      optionals:
        description: More RoleType members to instantiate, e.g. [ua:CustomConfiguration].
        type: array
        items:
          type: string
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
  RolePermissions:
    description: |
      Who may do what on this node (the RolePermissions attribute, OPC 10000-3 §5.2.9).
      Each entry names a Role, by the BrowseName of a RoleType instance (`ua:Operator`,
      `gds:DiscoveryAdmin`, or a role of this model), and the permissions it grants.
      An empty list grants nothing at all (HasNoPermissions); leaving the key out lets the
      node inherit the namespace default.
    type: array
    items:
      $ref: "#/$defs/RolePermission"
  RolePermission:
    type: object
    additionalProperties: false
    required: [role, permissions]
    properties:
      role:
        description: >
          A RoleType instance: `alias:BrowseName` (resolved among roles only, e.g.
          `ua:Operator`) or a full browse path.
        type: string
      permissions:
        description: >
          PermissionType bits, by name (they belong to OPC UA itself and take no namespace
          prefix), or `[all]`: every permission that applies to the node's NodeClass.
        oneOf:
          - type: array
            items:
              const: all
            minItems: 1
            maxItems: 1
          - type: array
            uniqueItems: true
            items:
              $ref: "#/$defs/PermissionName"
  PermissionName:
    enum:
      - Browse
      - ReadRolePermissions
      - WriteAttribute
      - WriteRolePermissions
      - WriteHistorizing
      - Read
      - Write
      - ReadHistory
      - InsertHistory
      - ModifyHistory
      - DeleteHistory
      - ReceiveEvents
      - Call
      - AddReference
      - RemoveReference
      - DeleteNode
      - AddNode
  AccessRestrictions:
    description: >
      How the channel must be secured before this node may be reached (the
      AccessRestrictions attribute, OPC 10000-3 §5.2.10).
    type: array
    uniqueItems: true
    items:
      enum: [SigningRequired, EncryptionRequired, SessionRequired, ApplyRestrictionsToBrowse]

  PermissionSet:
    type: object
    additionalProperties: false
    properties:
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
  ArgumentPermissions:
    description: >
      On a method: what its InputArguments and OutputArguments properties carry. Without it
      they get the method's roles, with Call read as Read and [all] as every Variable
      permission, and the method's accessRestrictions.
    type: object
    additionalProperties: false
    properties:
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
  BaseNode:
    description: "UABaseNode"
    title: "Generic OPCUA Node"
    type: object
    additionalProperties: true
    required:
      - browseName
    properties:
      browseName:
        $ref: "#/$defs/BrowseName"
      displayName:
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId:
        type: string
        description: |
         The nodeId is optional. If not specified, the modeler will automatically assign a nodeId to the created node. Upon model regeneration, the modeler ensures that the node retains the same nodeId as defined in the Symbol Table. Once a new nodeId is created, a corresponding entry is added to the Symbol list and persisted. This ensures that regeneration remains consistent as the model evolves.
  
  BaseNodeForConcreteTypeWithTypeDefinition:
    description: >
      UABaseNode ( for concrete type). the nodeClass of the node is infered 
      by its typeDefinition
    type: "object"
    required: []
    allOf:
      - $ref: "#/$defs/BaseNode"
      - $ref: "#/$defs/WithTypeDefinition"
      - $ref: "#/$defs/WithOptionals"

  BaseNodeForConcreteTypeWithNodeClass:
    description: "UABaseNode ( for concrete type) with enum specified"
    type: "object"
    required: [nodeClass]
    allOf:
      - $ref: "#/$defs/BaseNode"
      - properties:
          nodeClass:
            enum: [Object, Variable, Method]

  BaseNodeForConcreteType:
    description: "UABaseNode ( for concrete type)"
    type: "object"
    oneOf:
      - $ref: "#/$defs/BaseNodeForConcreteTypeWithTypeDefinition"
      - $ref: "#/$defs/BaseNodeForConcreteTypeWithNodeClass"

  BaseNodeForType:
    description: "UABaseNode"
    type: "object"
    allOf:
      - $ref: "#/$defs/BaseNode"
      - type: object
        properties:
          subtypeOf:
            $ref: "#/$defs/BaseTypeRef"
          isAbstract:
            type: boolean
            default: false

  ExistingNode:
    type: object
    description: reference an existing node in the parent object
    # additionalProperties: false
    required:
      - browseName
    properties:
      browseName:
        $ref: "#/$defs/BrowseName"
      displayName:
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
      components:
        type: array
        minItems: 1
        items:
          anyOf:
            - $ref: "#/$defs/ExistingNode"
            - $ref: "#/$defs/InstantiatedChildren"
      orderedComponents:
        type: array
        minItems: 1
        items:
          anyOf:
            - $ref: "#/$defs/ExistingNode"
            - $ref: "#/$defs/InstantiatedChildren"

  InstantiatedChildren:
    type: object
    additionalProperties: false
    description: reference a existing node in the parent object
    allOf:
      - $ref: "#/$defs/Variable"
      - $ref: "#/$defs/Object"
      - $ref: "#/$defs/InnerObject"
      - $ref: "#/$defs/InnerVariable"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithAnalogDataItemStuff"
    
      # - $ref: "#/$defs/MethodForType"
      - type: object
        additionalProperties: false
        required: [browseName, typeDefinition]
        properties:
          # from Variable
          ##  UABaseNode
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          nodeId: true
          ## VariableSpecific
          valueRank: true
          arrayDimensions: true
          dataType: true
          value: true
          # from Object
          methods: true
          typeDefinition: true
          # from WithPromotedToManadoty
          promotedToMandatory: true
          # from WithAnalogDataItemStuff
          engineeringUnits: true
          euRange: true
          valuePrecision: true
          instrumentRange: true
          definition: true

  AggregateC:
    type: object
    oneOf:
      - $ref: "#/$defs/ExistingNode"
      - $ref: "#/$defs/InstantiatedChildren"

  Aggregate:
    type: "object"
    properties:
      properties:
        description: |
          (B) contains the list of child properties of this object, referenced by a  "HasProperty" relationship.
          Properties must be Variables.
        type: array
        minItems: 1
        items:
          anyOf:
            - $ref: "#/$defs/Variable"
            - $ref: "#/$defs/InnerVariable"
      components:
        description: (I) contains the list of child components of this object, referenced by a "HasComponent" relationship.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/AggregateC"

      organizes:
        description: (I) contains the list of folder elements that are linked to this object via the "Organizes" relationship.
        type: array
        minItems: 1
        items:
          anyOf:
            - $ref: "#/$defs/OrganizesLink"
            - $ref: "#/$defs/InnerObject"
      methods:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/MethodDeclaration"

  OrganizesLink:
    type: string
    minLength: 1
    description: |
      A link to a node that exists elsewhere: an Organizes reference from this entry to it,
      the short form of a references: entry. In a type, `$Name` is the member of that type
      whose BrowseName is Name, at any depth (its own members first, then inherited ones), or
      the member that declares `$anchor: Name`; `/Folder/Name` is a path from the type.
      Outside types it is a browse path from the entry, `$Name` an instance.
    examples:
      - "$Speed"
      - "/Settings/Speed"

  MemberAnchor:
    type: string
    description: >
      A name for this member in the organizes: links of its type (`$Name`), when its
      BrowseName alone is ambiguous there.
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  AggregateForType:
    type: "object"
    additionalProperties: true
    properties:
      properties:
        description: |
          (A) contains the list of child properties of this object, referenced by a "HasProperty" relationship.
          Properties must be Variables.
        type: array
        items: 
          $ref: "#/$defs/VariableForType"
        minItems: 1
      components:
        description: VariableForType|ObjectForType contains the list of child components of this object, referenced by a  "HasComponent" relationship.
        type: array
        items:
          $ref: "#/$defs/VariableOrObjectForType"
      organizes:
        description: |
          VariableForType|ObjectForType - contains the list of folder elements that are
          linked to this object via the "Organizes" relationship.

          A folder may organize a Variable or a Property, not only an Object: that is the
          DI FunctionalGroup pattern, used throughout OPC 30500 LADS. The rule
          DSL-W-STRUCT-007 is what says a Property reached only through Organizes is poor
          modelling; the schema's job is to describe what a NodeSet can hold.

          A string item links a node declared elsewhere instead (see OrganizesLink).
        type: array
        items:
          anyOf:
            - $ref: "#/$defs/OrganizesLink"
            - $ref: "#/$defs/VariableOrObjectForType"
        minItems: 1

      methods:
        description: MethodForType - contains the list of methods that this object exposes
        type: array
        items:
          $ref: "#/$defs/MethodForType"
        minItems: 1
  AdvancedComponentContainment:
    type: "object"
    additionalProperties: true
    properties:
      orderedComponents:
        description: 
           VariableForType|ObjectForType contains the list of child components of this object, referenced by a  "HasOrderedComponent" relationship.

           The semantic of the HasOrderedComponent ReferenceType – besides the semantic of the HasComponent ReferenceType – is that when browsing from a Node and following References of this type or its subtype all References are returned in the Browse Service defined in OPC 10000-4 in a well-defined order. The order is Server-specific, but the Client can assume that the Server always returns them in the same order.

        type: array
        items:
          $ref: "#/$defs/ObjectForType"
        minItems: 1

      physicalComponents:

        description: |
           VariableForType|ObjectForType contains the list of child components of this object, referenced by a  "HaPhysicalComponent" relationship. 
           see https://reference.opcfoundation.org/Core/Part23/v105/docs/4.12

           This ReferenceType can be used to expose the relation between a hardware component and its subcomponent. An example for this reference is a modular IO-Station which is composed out of a device head and multiple IO-Modules or it can be used to relate a PC to a PCI board plugged inside the PC.
        type: array
        items:
          $ref: "#/$defs/ObjectForType"
        minItems: 1

      containedComponents:
        description: |
           VariableForType|ObjectForType contains the list of child components of this object, referenced by a  "HasContainedComponent" relationship. 
           https://reference.opcfoundation.org/Core/Part23/v105/docs/4.13

           This ReferenceType can be used to expose the relation between a hardware component and its subcomponent. It indicates that the subcomponent is inside the component. To gain access to the subcomponent typically removing a part of the component (e.g. a hatch) is necessary. For example, it can be used to relate a PC to a PCI board plugged inside the PC. The PCI board is accessible after removing the PC housing. It can also be used to relate a PLC to its CPU, which is hard wired to the PLC, or a network module to its Ethernet PHYs.
        type: array
        items:
          $ref: "#/$defs/ObjectForType"
        minItems: 1

      attachedComponents:
        description: |
          VariableForType|ObjectForType contains the list of child components of this object, referenced by a  "HasAttachedComponent" relationship. 
          https://reference.opcfoundation.org/Core/Part23/v105/docs/4.14

          This ReferenceType can be used to expose the relation between a hardware component and its subcomponent. It indicates that the subcomponent is attached to the component. That implies that the subcomponent is located in direct contact or direct vicinity of the component and is visible from the outside of the component without removing parts of the component (like a hatch). For example, it can be used to relate a drive device or a modular IO-station which is composed out of a device head and multiple IO-modules attached to the head to such an IO-module like a fieldbus interface module. Another example is a laptop having a removable battery attached to it.
        type: array
        items:
          $ref: "#/$defs/ObjectForType"
        minItems: 1
  # -----------------------------------------
  ImplementedInterface:
    type: "object"
    additionalProperties: true
    properties:
      browseName:
        $ref: "#/$defs/BrowseName"
      description:
        $ref: "#/$defs/LocalizedText"
      promotedToMandatory:
        $ref: "#/$defs/PromotedToMandatoryInner"

  # -----------------------------------------
  WithInterfaces:
    type: "object"
    additionalProperties: true
    properties:
      interfaces:
        description: |
          contains a list of Interfaces that the Object or Variable or Type implements
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/ImplementedInterface"
  
  WithOptionals:
    type: "object"
    additionalProperties: true
    properties:
      optionals: 
        description: >
          a list of BrowseName (with aliases) of the optional components or property to instantiate.

          Specifying nested components is possible.

            optionals: [ "Property.ChildProperty", "TopLevelProperty" ]

          Items can also be key-value pairs to specify a default value:

            optionals:
              - di:SerialNumber
              - di:Unit: "°C"
              - di:Manufacturer: "Sterfive"

          Can also be specified as a single string:

            optionals: "TopLevelProperty"

        oneOf:
          - type: string
          - type: array
            items:
              oneOf:
                - type: string
                - type: object
                  minProperties: 1
                  maxProperties: 1
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: object
            minItems: 1
 
  PromotedToMandatoryInner:
        type: array
        description: >
          a list of BrowseName (with aliases) of the optional components or property to instantiate
          and turn to modellingRule = mandatory
          Specifying nested components is possible.
          
               optionals: [ "Property.ChildProperty", "TopLevelProperty" ]
        items:          
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
                - type: string
                - type: object
                  minProperties: 1
                  maxProperties: 1
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: object
            minItems: 1
        minItems: 1

  WithPromotedToMandatory:
    type: "object"
    additionalProperties: true
    properties:
      promotedToMandatory: 
        $ref: "#/$defs/PromotedToMandatoryInner"


  WithInitializers:
    type: "object"
    additionalProperties: true
    properties:
      initializers:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Initializer"

  WithReferences:
    type: "object"
    additionalProperties: true
    properties:
      references:
        description: >
          Additional references to emit from this node, beyond the ones implied
          by its placement (organizedBy / componentOf / …).
        type: array
        minItems: 1
        items:
          anyOf:
            - $ref: "#/$defs/Reference"
            - $ref: "#/$defs/DeclaringReference"

  DeclaringReference:
    type: object
    description: >
      A reference that declares its target: the node is created under the owner
      (source must be "/", the owner becomes its ParentNodeId) and linked by
      referenceType alone. For a member owned through a reference type the DSL
      has no key for, e.g. DI's NetworkType ConnectsTo <CPIdentifier>.
    required: [source, target, referenceType]
    properties:
      source:
        const: "/"
      referenceType:
        type: string
      target:
        $ref: "#/$defs/VariableOrObjectForType"

  WithDocumentation:
    type: "object"
    additionalProperties: true
    properties:
      documentation:
        description: >
          Long-form markdown for this node, rendered into the generated
          documentation. `!include` directives are expanded and headers are
          re-levelled. Distinct from `description`, which is the OPC UA
          Description attribute — a single line carried in the address space.
        type: string
      specRef:
        description: >
          A link into the specification text that defines this node, such as
          `https://reference.opcfoundation.org/Machinery/v104/docs/8.2`. It is
          written to the NodeSet2 as the node's `<Documentation>` element and read
          back by the reverse. Distinct from `documentation`, which is markdown for
          the generated document and never reaches the NodeSet2. A member copied from
          a type's member of the same namespace inherits that member's link; `false`
          says this copy has none.
        oneOf:
          - type: string
            format: uri
          - const: false

  WithAnalogDataItemStuff: 
    type: "object"
    additionalProperties: true
    properties:
      engineeringUnits:
        $ref: "#/$defs/UnitRef"
      valuePrecision: 
        type: number
      euRange:  
        description: "the euRange property value"
        type: array
        items:
          type: number
      instrumentRange:  
        description: "the euRange property value"
        type: array
        items:
          type: number
      definition:
        type: string




  AddInInstance:
    type: "object"
    properties:
      typeDefinition:
        description: |
           the type definition for the instance
      modellingRule:
        description: the modelling rule of the add-in in a type (Mandatory, Optional, ...)
      description:
        type: string
      promotedToMandatory:
        description: optional children of the add-in type to instantiate as Mandatory
        type: array
        items:
          type: string
      properties:
        description: |
          the add-in's own properties, beyond those instantiated from its type
          (a companion spec re-exposing an add-in and adding members to it).
        type: array
        items:
          $ref: "#/$defs/VariableForType"
        minItems: 1
      components:
        description: the add-in's own components, beyond those instantiated from its type
        type: array
        items:
          $ref: "#/$defs/VariableOrObjectForType"
        minItems: 1
      methods:
        description: the add-in's own methods, beyond those instantiated from its type
        type: array
        items:
          $ref: "#/$defs/MethodForType"
        minItems: 1
      browseName:
        description: |
           the default browse name of the add in instance , if not specified
           then the default browse name specified in the type definition of the add in is used.
      optionals:
        description: >
          a list of BrowseName (without aliases) of the optional components or property to instantiate.

          Specifying nested components is possible.

            optionals: [ "Property.ChildProperty", "TopLevelProperty" ]

          Can also be specified as a single string, as on any other node.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
            minItems: 1
  # -----------------------------------------
  WithAddIns:
    type: "object"
    additionalProperties: true
    properties:
       addIns:
        description: |
          contains a list of Add ins that the Object or Variable or Type implements
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/AddInInstance"
   
  ObjectType:
    description: describe a OPCUA ObjectType
    type: object
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - $ref: "#/$defs/AggregateForType"
      - $ref: "#/$defs/AdvancedComponentContainment"
      - $ref: "#/$defs/WithInterfaces"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithAddIns"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/EventGenerator"
      - $ref: "#/$defs/WithDocumentation"
    additionalProperties: false
    required: [browseName]
    properties:
      ## --- base Node
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId: true
      ## --- WithDocumentation
      documentation: true
      specRef: true
      ## --- base Node for Type
      isAbstract: true
      subtypeOf: true
      ## ---- aggregates
      properties: true
      components: true
      organizes: true
      references: true
      methods: true
      ## ---- WithInterfaces
      interfaces: true
      promotedToMandatory: true
      defaultInstanceBrowseName:
        description: >
          The browseName an addIn of this type gets when the addIn entry does
          not name one itself. Emitted as the type's DefaultInstanceBrowseName
          property.
        $ref: "#/$defs/BrowseName"
      ## ---- WithAddIns
      addIns: true
      ## 
      generatedEvents: true
      eventSources: true
      ## AdvancedComponentContainment
      orderedComponents: true
      physicalComponents: true
      containedComponents: true
      attachedComponents: true
      ## >>> extension blocks: ObjectType (generated by tools/merge-extension-schemas.ts, ADR-010)
      di:
        $ref: "#/$defs/DiBlock"
      fx:
        $ref: "#/$defs/FxBlock"
      ## <<< extension blocks: ObjectType

  EventGenerator:
    type: object
    properties:
      generatedEvents:
        description: specify the list of Event types that this element generates, this will create a GeneratesEvent reference 
        type: array
        items:
          type: string
      eventSources:
        $ref: "#/$defs/EventSources"

  ## HasEventSource (OPC 10000-3 7.17), written like organizedBy / componentOf.
  ## A type has only eventSources, naming its own members (/Motor): a type node
  ## is the event source of nothing, so eventSourceOf is an instance key.
  EventSources:
    description: >
      The nodes this node is the event notifier of: one HasEventSource
      reference from this node to each browse path.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/BrowsePath"

  EventSourceLinks:
    type: object
    properties:
      eventSources:
        $ref: "#/$defs/EventSources"
      eventSourceOf:
        description: >
          The browse path of this instance's event notifier: a HasEventSource
          reference from that node to this one.
        $ref: "#/$defs/BrowsePath"

  ## The UAVariable attributes that describe HOW a value is reached rather
  ## than what it is: accessLevel, userAccessLevel, minimumSamplingInterval,
  ## historizing. Kept under the historical name because several defs $ref it.
  ##
  ## INSTANCE-ONLY, deliberately: the UANodeSet XSD gives UAVariableType only
  ## DataType, ValueRank, ArrayDimensions and IsAbstract, so `VariableType`
  ## must never $ref this def.
  WithAccessLevel:
    type: object
    properties:
      accessLevel:
        description: >
          A `|`-separated flag list, e.g. "CurrentRead | CurrentWrite".
          Valid flags: CurrentRead, CurrentWrite, HistoryRead, HistoryWrite,
          SemanticChange, StatusWrite, TimestampWrite.
        type: string
      userAccessLevel:
        description: >
          Same syntax as `accessLevel`, but the access the CURRENT user has.
          It can only narrow `accessLevel`, never widen it.
        type: string
      minimumSamplingInterval:
        description: >
          The fastest rate, in milliseconds, at which the server can sample the
          value. 0 means the value is kept continuously up to date.
        type: number
      historizing:
        description: >
          Whether the server actively collects history for this Variable.
          Defaults to false.

          Set it together with the HistoryRead access flag, e.g.
          `accessLevel: "CurrentRead | HistoryRead"` — historizing declares
          that history is collected, accessLevel declares that it can be read.
        type: boolean

  VariableSpecific:
    type: object
    properties:
      valueRank:
        type: number
      arrayDimensions:
        type: array
        items:
          type: number
        minItems: 1
      dataType:
        $ref: "#/$defs/DataTypeRef"
      value:
        $ref: "#/$defs/Variant"
      exposesItsArray:
        type: boolean
        description: >-
          On a member Variable of a type: this member is the element of its parent's array, i.e.
          modellingRule ExposesItsArray (OPC 10000-3 6.4.4.4.5). The parent must be a Variable or
          VariableType holding an array; cannot be combined with another modellingRule.

  VariableType:
    description: >
      Describes an OPC UA VariableType.

      Deliberately NOT `WithAccessLevel`: the UANodeSet XSD gives
      `UAVariableType` only DataType, ValueRank, ArrayDimensions and
      IsAbstract. accessLevel / userAccessLevel / minimumSamplingInterval are
      attributes of a Variable INSTANCE — node-opcua does not even store them
      on a VariableType, and they can never reach the generated NodeSet2 XML.
      Set them on the instances instead.
    type: object
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - $ref: "#/$defs/AggregateForType"
      - $ref: "#/$defs/VariableSpecific"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/AdvancedComponentContainment"
    additionalProperties: false
    # dataType is not required: a VariableType without one inherits the DataType
    # of its subtypeOf, which lives in another type (often another namespace) and
    # cannot be seen from here. The compiler warns when nothing is inherited.
    required: [browseName]
    properties:
      # base node
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId: true
      documentation: true
      specRef: true

      # base node for type
      isAbstract: true
      subtypeOf: true

      ## ---- aggregates
      properties: true
      components: true
      organizes: true
      references: true
      methods: true

      # variant specific
      dataType: true
      value: true
      valueRank: true
      # was `arrayDimension` (singular): a key VariableSpecific never defines,
      # so the correct spelling was rejected while the typo was accepted and
      # then ignored by the loader.
      arrayDimensions: true
      # no exposesItsArray: it sets the modelling rule of a member Variable,
      # and a VariableType entry has none

      # read by addVariableType like on an ObjectType (OPC 30500 ADI, Scales)
      promotedToMandatory: true
      orderedComponents: true
      physicalComponents: true
      containedComponents: true
      attachedComponents: true

  ArgumentArray:
    type: array
    items:
      $ref: "#/$defs/Argument"
    minItems: 1

  Argument:
    type: object
    additionalProperties: false
    required: [name, dataType]
    properties:
      name:
        type: string
      dataType:
        $ref: "#/$defs/DataTypeRef"
      description:
        allOf:
          - $ref: "#/$defs/LocalizedText"
      valueRank:
        type: number
        default: -1
      arrayDimensions:
        type: array
        items:
          type: number

  MethodDeclaration:
    type: object
    required: [browseName]
    properties:
      browseName:
        $ref: "#/$defs/BrowseName"
      displayName:
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId:
        description: >
          Optional explicit NodeId (e.g. `s=Calibrate`). When omitted the
          modeler assigns one and persists it in the symbol table so that it
          survives regeneration.
        type: string
      executable:
        type: boolean
      argumentPermissions:
        $ref: "#/$defs/ArgumentPermissions"
      inputArguments:
        $ref: "#/$defs/ArgumentArray"
      outputArguments:
        $ref: "#/$defs/ArgumentArray"

  Object:
    type: object
    allOf:
      - $ref: "#/$defs/BaseNode"
      - $ref: "#/$defs/WithInterfaces"
      - type: object
        properties:
          typeDefinition:
            $ref: "#/$defs/TypeDefinitionProp"
          organizedBy:
            description: the organizedBy property specify the browsePath of parent OPCUA Node with which this object is linked with a Organizes reference.
            $ref: "#/$defs/BrowsePath"
          nodeClass:
            enum: [Object]
          methods:
            type: array
            items:
             $ref: "#/$defs/MethodDeclaration"

    # additionalProperties:
    # $ref: "#/$defs/BaseNode"
    # additionalProperties: false
  # -----------------------------------------
  Variable:
    type: object
    additionalProperties: false
    required: [browseName]
    allOf:
      - $ref: "#/$defs/BaseNodeForConcreteType"
      - $ref: "#/$defs/VariableSpecific"
      - $ref: "#/$defs/Aggregate"
      - $ref: "#/$defs/WithAccessLevel"
      - $ref: "#/$defs/WithInterfaces"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/ModellingRuleProp"
    properties:
      ## Variable
      $anchor:
        $ref: "#/$defs/MemberAnchor"
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeClass: true
      typeDefinition: true
      ## for variable
      dataType: true
      valueRank: true
      arrayDimensions: true
      value: true
      minimumSamplingInterval: true
      historizing: true
      accessLevel: true
      userAccessLevel: true
      # from VariableSpecific: the ExposesItsArray modelling rule, member Variables only
      exposesItsArray: true
      ## ModellingRuleProp
      modellingRule: true
      ## for nested structure
      components: true
      organizes: true
      properties: true
      references: true
      interfaces: true
      promotedToMandatory: true
      methods: true

  ObjectForType:
    type: object
    additionalProperties: false
    required: [browseName]
    allOf:
      - $ref: "#/$defs/Object"
      - $ref: "#/$defs/ModellingRuleProp"
      - $ref: "#/$defs/WithInterfaces"
      - $ref: "#/$defs/AggregateForType"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/AdvancedComponentContainment"
      - $ref: "#/$defs/WithOptionals"

    properties:
      $anchor:
        $ref: "#/$defs/MemberAnchor"
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeClass: true
      nodeId: true
      typeDefinition: true
      modellingRule: true
      optionals: true
      ## for nested structure
      components: true
      organizes: true
      properties: true
      references: true
      interfaces: true
      promotedToMandatory: true
      methods: true
      ## AdvancedComponentContainment: read by the loader at every level
      orderedComponents: true
      physicalComponents: true
      containedComponents: true
      attachedComponents: true

  VariableForType:
    type: object
    additionalProperties: true
    required: [browseName]
    anyOf:
      - $ref: "#/$defs/Variable"
      - $ref: "#/$defs/BaseNodeForConcreteType"
      - $ref: "#/$defs/VariableSpecific"
      ## - $ref: "#/$defs/WithAnalogDataItemStuff"
      ## - $ref: "#/$defs/ModellingRuleProp"
    properties:
      ## Variable
      $anchor:
        $ref: "#/$defs/MemberAnchor"
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeClass: true
      nodeId: true
      typeDefinition: true
      ## for variable
      dataType: true
      valueRank: true
      arrayDimensions: true
      value: true
      minimumSamplingInterval: true
      historizing: true
      accessLevel: true
      userAccessLevel: true
      ## ModellingRuleProp
      modellingRule: true
      ## for nested structure
      components: true
      organizes: true
      properties: true
      interfaces: true
      promotedToMandatory: true
      methods: true
      # # from AnalogItemStuff
      # engineeringUnits: true
      # euRange: true
      # valuePrecision: true
      # instrumentRange: true
      # definition: true

  VariableOrObjectForType:
    type: object
    additionalProperties: false
    required: [browseName]
    anyOf:
      - $ref: "#/$defs/VariableForType"
      - $ref: "#/$defs/ObjectForType"
      - $ref: "#/$defs/ExistingNode"
      - $ref: "#/$defs/WithPropertyValues"
    ## Typing only — these must NOT join the anyOf above, where they would
    ## each become a way for the member to validate rather than a constraint
    ## on it. Every one is additionalProperties:true with no required key, so
    ## they narrow the whitelisted values without rejecting anything new.
    allOf:
      - $ref: "#/$defs/AggregateForType"
      - $ref: "#/$defs/WithAccessLevel"
      - $ref: "#/$defs/WithAddIns"
      - $ref: "#/$defs/WithAnalogDataItemStuff"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/AdvancedComponentContainment"
    properties:
      $anchor:
        $ref: "#/$defs/MemberAnchor"
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeClass: true
      nodeId: true
      typeDefinition: true
      promotedToMandatory: true
      ## AdvancedComponentContainment: read by the loader at every level
      orderedComponents: true
      physicalComponents: true
      containedComponents: true
      attachedComponents: true
      # WithOptionals
      optionals: true
      ## for variable
      dataType: true
      valueRank: true
      arrayDimensions: true
      value: true
      minimumSamplingInterval: true
      historizing: true
      accessLevel: true
      userAccessLevel: true
      # the ExposesItsArray modelling rule of a member Variable (see VariableSpecific)
      exposesItsArray: true
      ## ModellingRuleProp
      modellingRule: true
      ## for nested structure
      components: true
      organizes: true
      properties: true
      references: true
      interfaces: true
      methods: true
      # from WithAddIns — an organized object may itself carry add-ins
      addIns: true
      # from WithAnalogDataItemStuff
      engineeringUnits: true
      euRange: true
      valuePrecision: true
      instrumentRange: true
      definition: true
      # from WithPropertyValues
      propertyValues: true

  ModellingRuleProp:
    type: object
    properties:
      modellingRule:
        $ref: "#/$defs/ModellingRule"

  MethodForTypeExtensible:
    type: object
    required: ["browseName"]
    allOf:
      - $ref: "#/$defs/MethodDeclaration"
      - $ref: "#/$defs/ModellingRuleProp"
      - $ref: "#/$defs/WithDocumentation"
    properties:
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeId: true
      executable: true
      argumentPermissions:
        $ref: "#/$defs/ArgumentPermissions"
      inputArguments: true
      outputArguments: true
      modellingRule: true

  ## No nodeClass: everything under `methods:` is a Method, so the key could
  ## only restate it. (Under `organizes:`, which mixes node classes, it is needed.)
  MethodForType:
    type: object
    additionalProperties: false
    required: ["browseName"]
    allOf:
      - $ref: "#/$defs/MethodDeclaration"
      - $ref: "#/$defs/ModellingRuleProp"
      - $ref: "#/$defs/WithDocumentation"
    properties:
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      nodeId: true
      modellingRule: true
      ##
      executable: true
      argumentPermissions:
        $ref: "#/$defs/ArgumentPermissions"
      inputArguments: true
      outputArguments: true

  DataTypeBasic:
    description: A DataType derived from a built-in scalar — the OPC UA equivalent of a typedef.
    type: object
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - type: object
        properties:
          browseName: true
          subtypeOf:
            $ref: "#/$defs/BaseTypeRef"
      ## Closing branch — see the note on DataType below. It re-lists every allowed
      ## property because `additionalProperties: false` only sees the properties
      ## declared in its OWN allOf branch: attaching it to the branches above (or to
      ## the definition itself, where it sat commented out) rejects everything they
      ## allow. Without this branch DataTypeBasic matched ANY object carrying a
      ## browseName, which made it a catch-all that silently accepted typos and
      ## rescued malformed entries from the other two flavours.
      - $ref: "#/$defs/WithDocumentation"
      - type: object
        properties:
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          nodeId: true
          subtypeOf: true
          isAbstract: true
          ## Unreachable for validation, present for completion. DataType routes
          ## here only when NEITHER key is present, so a document carrying one
          ## can never be judged by this branch — but the editor resolves a
          ## half-typed entry to this same branch, and without the two keys it
          ## cannot suggest the very properties that pick the other flavours.
          ## Omitting them left `enum:` and `fields:` discoverable only on a bare
          ## `-`, before any browseName had been typed.
          enum:
            $ref: "#/$defs/EnumerationDefinition"
          fields:
            type: array
            items:
              $ref: "#/$defs/StructureField"
        required: [browseName]
        additionalProperties: false

  DataTypeEnumeration:
    description: Enumeration.
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - $ref: "#/$defs/WithDocumentation"
      - properties:
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          nodeId: true
          isAbstract: true
          subtypeOf:
            enum: [ua:Enumeration]
          enum:
            $ref: "#/$defs/EnumerationDefinition"
          enumProperty:
            description: >
              The Property that publishes the members. By default EnumStrings when
              the values are 0, 1, 2, … in order and no member has a description or
              a displayName of its own, EnumValues otherwise. EnumStrings keeps the
              descriptions in the DataTypeDefinition only.
            enum: [EnumStrings, EnumValues]
        type: object
        required: ["enum"]
        additionalProperties: false

  ## OPC 10000-3 5.8, the UInteger form: a bit mask. Each value is the mask of
  ## one bit (1, 2, 4, 8, ...) so values combine with |; the NodeSet stores the
  ## bit position. The loader checks what a schema cannot: one bit per value,
  ## no bit twice, and every bit within the width of subtypeOf.
  DataTypeOptionSet:
    description: >
      An OptionSet: a bit mask whose bits are named in enum. Each enum value is
      the mask of one bit (1, 2, 4, 8, ...); without values the masks follow
      the order of the list.
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - $ref: "#/$defs/WithDocumentation"
      - properties:
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          nodeId: true
          isAbstract: true
          isOptionSet:
            const: true
          subtypeOf:
            description: >
              the unsigned integer that holds the mask (ua:Byte, ua:UInt16,
              ua:UInt32, ua:UInt64 or a subtype of one), defaults to ua:UInt32;
              or ua:OptionSet (or a subtype), the Structure whose ByteStrings
              hold any number of bits
            $ref: "#/$defs/DataTypeRef"
          enum:
            oneOf:
              - $ref: "#/$defs/EnumerationDefinitionAsStringList"
              - type: array
                items:
                  $ref: "#/$defs/OptionSetField"
        type: object
        required: [isOptionSet, enum]
        additionalProperties: false

  OptionSetField:
    type: object
    properties:
      name:
        type: string
      value:
        description: the mask of this bit, a power of two (1, 2, 4, 8, ...)
        type: integer
        minimum: 1
      displayName:
        description: the text of this bit in OptionSetValues; defaults to name
        $ref: "#/$defs/LocalizedText"
      description:
        $ref: "#/$defs/LocalizedText"
    required: [name]
    additionalProperties: false

  DataTypeStructure:
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - type: object
        properties:
          isUnion:
            type: boolean
            description: set to true if the structure is an union
            default: false
          hasVariableType:
            type: boolean
            default: false
            description: |
              When hasVariableType=true, a corresponding VariableType is created automatically.
              If the extension object data type is named MyStructureDataType, the corresponding VariableType browseName will be MyStructureType.
          variableType:
            type: object
            description: |
              Refines the VariableType that hasVariableType generates (and implies hasVariableType: true).
              A component naming a generated field adjusts it (modellingRule, dataType, valueRank, and its own
              components for the field's sub-fields); any other component or property is added to the VariableType.
            properties:
              components:
                type: array
                items:
                  $ref: "#/$defs/VariableOrObjectForType"
              properties:
                type: array
                items:
                  $ref: "#/$defs/VariableOrObjectForType"
            additionalProperties: false
          fields:
            description: a list of fields defining the structure.
            type: array
            items:
              $ref: "#/$defs/StructureField"
            minItems: 0
      - $ref: "#/$defs/WithDocumentation"
      - properties:
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          nodeId: true
          isAbstract: true
          subtypeOf: true
          isUnion: true
          hasVariableType: true
          variableType: true
          fields: true
        type: object
        description: DataType structure browse name should follow the naming pattern MyStructureDataType
        required: [browseName, fields]
        additionalProperties: false

  ## The three flavours are mutually exclusive and discriminated by which key is
  ## present: `fields` → Structure, `enum` → Enumeration, neither → Basic. Each
  ## therefore ends in a closing branch carrying `additionalProperties: false`, so
  ## an entry that matches none of them is reported instead of quietly validating.
  ## Keep them CLOSED: an open flavour rescues malformed entries of the other two,
  ## and a completion client offers the open branch as a generic "any node here".
  ##
  ## Spelled as if/then/else rather than the anyOf this used to be.
  ## Both validate the same documents, but anyOf hides the discriminator from the
  ## editor: yaml-language-server cannot tell which branch a half-typed entry is
  ## aiming at, so it resolved NOTHING inside one and returned zero completions
  ## for every nested position — `enum:` items offered no name/value/displayName/
  ## description at all, and Monaco's word-based suggestions filled the vacuum
  ## with whatever words the buffer already contained. if/then/else names the
  ## discriminating key up front, so the editor commits to a branch immediately.
  ## It also blames the right key: an enum entry with a bad `subtypeOf` now reads
  ## `Valid values: "ua:Enumeration"` instead of `Property enum is not allowed`,
  ## which was anyOf reporting the LAST branch to reject the entry.
  DataType:
    if:
      type: object
      required: [isOptionSet]
    then:
      $ref: "#/$defs/DataTypeOptionSet"
    else:
     if:
      type: object
      required: [enum]
     then:
      $ref: "#/$defs/DataTypeEnumeration"
     else:
      if:
        type: object
        ## `fields` is the structure's own discriminator, but isUnion and
        ## hasVariableType are structure-only as well, so they count as signals
        ## too. Without them a half-typed structure fell through to Basic and was
        ## told `Property isUnion is not allowed` — true of Basic, misleading to
        ## an author who simply had not written `fields:` yet. Counting them
        ## judges it AS a structure, which reports `Missing property "fields"`
        ## and offers the other structure properties while it is being written.
        anyOf:
          - required: [fields]
          - required: [isUnion]
          - required: [hasVariableType]
      then:
        $ref: "#/$defs/DataTypeStructure"
      else:
        $ref: "#/$defs/DataTypeBasic"

  ReferenceType:
    type: object
    allOf:
      - $ref: "#/$defs/BaseNodeForType"
      - $ref: "#/$defs/WithDocumentation"
      - type: object
        properties:
          # base node
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          nodeId: true
          # base node for type
          isAbstract: true
          subtypeOf: true

          symmetric:
            type: boolean
            default: false
            description: >-
              the reference means the same in both directions, like DI's ConnectsTo
              (OPC 10000-3 §5.3.3). A symmetric ReferenceType has no inverseName.
          inverseName:
            type: string
        required: [browseName]
        additionalProperties: false
  Reference:
    type: object
    properties:
      source:
        type: string
      target:
        type: string
      referenceType:
        type: string
      isForward:
        description: >
          Direction of the reference. true (the default): source -> target;
          false: target -> source, i.e. the inverse reference.
        type: boolean
        default: true

  Variant:
    oneOf:
      - type: string # $ref: "#/definition/DataType"
      - type: number # $ref: "#/definition/DataType"
      - type: boolean # $ref: "#/definition/DataType"
      - type: object # $ref: "#/definition/DataType"
      - type: array # $ref: "#/definition/DataType"
      - type: "null"

  ConnectedObject:
    type: object
    description: |
      A ConnectedObject must be linked to its parent through exactly one of the
      following references: organizedBy, componentOf, propertyOf,
      orderedComponentOf, physicalComponentOf, or containedComponentOf.
    properties:
      organizedBy:
        description: the organizedBy property specify the browsePath of parent OPCUA Node with which this object is linked with a Organizes reference.
        $ref: "#/$defs/BrowsePath"
      componentOf:
        description: the componentOf property specify the browsePath of parent OPCUA Node with which this object is linked with a HasComponent reference.
        $ref: "#/$defs/BrowsePath"
      propertyOf:
        description: the propertyOf property specify the browsePath of parent OPCUA Node with which this object is linked with a HasProperty reference.
        $ref: "#/$defs/BrowsePath"
      orderedComponentOf:
        description: the orderedComponentOf property specify the browsePath of parent OPCUA Node with which this object is linked with a HasOrderedComponent reference.
        $ref: "#/$defs/BrowsePath"
      physicalComponentOf:
        description: the physicalComponentOf property specify the browsePath of parent OPCUA Node with which this object is linked with a HasPhysicalComponent reference.
        $ref: "#/$defs/BrowsePath"
      containedComponentOf:
        description: the containedComponentOf property specify the browsePath of parent OPCUA Node with which this object is linked with a HasContainedComponent reference.
        $ref: "#/$defs/BrowsePath"
    oneOf:
      - required: [organizedBy]
      - required: [componentOf]
      - required: [propertyOf]
      - required: [orderedComponentOf]
      - required: [physicalComponentOf]
      - required: [containedComponentOf]

  InnerVariable:
    type: object
    allOf:
      - $ref: "#/$defs/BaseNode"
      - $ref: "#/$defs/Aggregate"

  InnerObject:
    type: object
    additionalProperties: false
    required: [browseName]
    allOf:
      - $ref: "#/$defs/BaseNode"
      - $ref: "#/$defs/VariableSpecific"
      - $ref: "#/$defs/Aggregate"
      - $ref: "#/$defs/WithTypeDefinition"
      - $ref: "#/$defs/WithPromotedToMandatory"
      - $ref: "#/$defs/WithOptionals"
      - $ref: "#/$defs/WithPropertyValues"
      - $ref: "#/$defs/WithDocumentation"
    properties:
      ## ---  base Node
      $anchor:
        $ref: "#/$defs/MemberAnchor"
      browseName: true
      displayName: true
      description: true
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      documentation: true
      specRef: true
      # organizes: mixes node classes, so an untyped entry says which one it is
      nodeClass:
        enum: [Object, Variable, Method]
      typeDefinition: true
      promotedToMandatory: true
      ## --- variable specific
      ## ---- aggregates
      properties: true
      components: true
      organizes: true
      optionals: true
      ## -- with property values
      propertyValues: true

  TypeDefinitionProp:
    description: the reference to the OPCUA Type
    type: string
    anyOf:
      - $ref: "#/$defs/TypeReference"
      - $ref: "#/$defs/BrowsePath"
      - pattern: "(([a-zA-Z0-9_]):?)([A-Z]+[a-zA-Z0-9_])"

  WithTypeDefinition:
    type: object
    properties:
      typeDefinition:
        $ref: "#/$defs/TypeDefinitionProp"

  ## The Variable-only attributes of an `instances:` entry. Deliberately NOT
  ## `VariableSpecific` (which type members use): that one also carries
  ## `exposesItsArray`, which addInstance does not implement — and a property
  ## the schema offers but the loader ignores is the same defect this def
  ## exists to close. Keep this list == the Instance whitelist == addInstance.
  VariableFacet:
    description: >
      Attributes that apply when the instance is a Variable, i.e. when its
      `typeDefinition` names a VariableType rather than an ObjectType.
    type: object
    allOf:
      - $ref: "#/$defs/WithAccessLevel"
    properties:
      dataType:
        description: >
          The DataType of the Variable.

          Optional when the VariableType already carries a concrete DataType
          (e.g. `ua:TwoStateDiscreteType` → Boolean) — the instance inherits it.
          REQUIRED when the type leaves DataType unspecified
          (`ua:BaseDataVariableType`, `ua:BaseVariableType`, `ua:PropertyType`)
          or only narrows it to an abstract one (`ua:AnalogItemType` → Number),
          because a Variable node cannot have an abstract or empty DataType.
        $ref: "#/$defs/DataTypeRef"
      value:
        description: the initial value of the Variable, coerced to its dataType.
        $ref: "#/$defs/Variant"
      valueRank:
        description: >
          -1 scalar (default), 0 one-or-more dimensions, 1 one-dimensional
          array, n>1 an array with n dimensions.
        type: number
      arrayDimensions:
        description: the length of each dimension; implies valueRank when omitted.
        type: array
        items:
          type: number
        minItems: 1

  Instance:
    description: >
      Describes an OPC UA Object OR Variable instance.

      Which one it is follows from `typeDefinition`: an ObjectType makes it an
      Object, a VariableType makes it a Variable. A Variable instance may then
      carry the Variable facet below (`dataType`, `value`, `valueRank`,
      `arrayDimensions`, `accessLevel`, `minimumSamplingInterval`).

      `dataType` is optional when the VariableType supplies a concrete one of
      its own (e.g. `ua:TwoStateDiscreteType` → Boolean), and required when it
      does not — `ua:BaseDataVariableType`, `ua:BaseVariableType` and
      `ua:PropertyType` leave DataType unspecified, and `ua:AnalogItemType`
      only narrows it to the abstract `Number`.
    type: object
    allOf:
      - $ref: "#/$defs/InstanceStuff"
      - $ref: "#/$defs/Aggregate"
      # the placement and the typeDefinition, unless a DSL extension block may supply them: the
      # expansion runs before compilation, and the compiler still requires both (ADR-010)
      - if:
          anyOf:
            ## >>> extension required: Instance
            - required: [di]
            - required: [fx]
            ## <<< extension required: Instance
        then: {}
        else:
          allOf:
            - $ref: "#/$defs/ConnectedObject"
            - required: [typeDefinition]
      - $ref: "#/$defs/WithTypeDefinition"
      - $ref: "#/$defs/WithOptionals"
      - $ref: "#/$defs/WithInterfaces"
      - $ref: "#/$defs/WithInitializers"
      - $ref: "#/$defs/WithPropertyValues"
      - $ref: "#/$defs/VariableFacet"
      - $ref: "#/$defs/WithAddIns"
      - $ref: "#/$defs/WithReferences"
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/EventSourceLinks"
      - type: object
        description: describe a OPCUA Object instance. 2
        additionalProperties: false
        required: [browseName]
        properties:
          ## --- instance stuff
          $anchor: true
          browseName: true
          displayName: true
          description: true
          rolePermissions:
            $ref: "#/$defs/RolePermissions"
          permissionSet:
            description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
            type: string
          accessRestrictions:
            $ref: "#/$defs/AccessRestrictions"
          documentation: true
          specRef: true
          typeDefinition: true
          optionals: true
          nodeId: true
          references: true
          ## ---- aggregates
          properties: true
          components: true
          organizes: true
          methods: true
          ##  ----- connectable object
          organizedBy: true
          componentOf: true
          propertyOf: true
          orderedComponentOf: true
          physicalComponentOf: true
          containedComponentOf: true
          ## ---- event notifier hierarchy
          eventSources: true
          eventSourceOf: true
          ## --- aggregates
          addIns: true
          ## When instance is a Variable (see VariableFacet)
          dataType: true
          value: true
          valueRank: true
          arrayDimensions: true
          accessLevel: true
          userAccessLevel: true
          minimumSamplingInterval: true
          historizing: true
          # With Interface
          interfaces: true
          # With Initializers
          initializers: true
          # With Property Values
          propertyValues: true
          modellingRule:
            description: >
              Only for a member of a type that an instance declaration of that type organizes
              (OPC 10000-81 UAFX AC FunctionalEntityType/ConfigurationData organizes Configuration
              and Tuning): with organizedBy naming that declaration, the entry is built as one of
              its organizes, and takes it as ParentNodeId. A real instance carries no modelling rule.
            enum: [Mandatory, Optional]
          ## >>> extension blocks: Instance (generated by tools/merge-extension-schemas.ts, ADR-010)
          di:
            $ref: "#/$defs/DiBlock"
          fx:
            $ref: "#/$defs/FxBlock"
          ## <<< extension blocks: Instance

  InstanceStuff:
    type: object
    properties:
      $anchor:
        type: string
        description: >
          Optional user-defined anchor name used as the path token in
          organizedBy / componentOf / propertyOf values (e.g. $MainRobot).
          When omitted the token defaults to the local part of browseName,
          with a numeric suffix appended automatically for duplicates.
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      browseName:
        $ref: "#/$defs/BrowseName"
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId:
        $ref: "#/$defs/NodeIdWithoutNamespace"
      displayName:
        type: string
      description:
        type: string

  TypeReference:
    type: object
    properties:
      name:
        type: string
      namespace:
        type: string
        
  ## => PropertyValue
  # a property value is a nested object
  # whose keys are OPCUA property alias browseName
  # and leafs are Value

  # for instance:
  # propertyValues: 
  #   di:ParameterSet:   # an object exists
  #     Pressure:  # a component Variable
  #       EURange: [ 10, 20]   # a Property Variable
  #     Temperature:  # a component Variable
  #       EngineeringUnit: "%/in"   # a PropertyVariable
  #   di:SerialNumber: SN1234 # a propertyVariable
  #   machinery:YearOfConstruction: 2025  # etc .. 
  #   bar:Recipess:
  #     - MyDataType: 
  #         Id: 1
  #         Name: "recette1"
  #         Description: "recette 1"
  #     - bar:Recipe:   
  #       MyDataType: 
  #         Id: 1
  #         Name: "recette2"
  #         Description: ""    

  PropertyValues:
    description: >
      A nested object whose keys are aliased BrowseNames and whose
      values are either leaf values or nested PropertyValues objects.

      When a Variable has both a value AND sub-properties (e.g.
      AnalogItem with EngineeringUnits), use the special `$value`
      key for the variable's own value. The `$` prefix is reserved
      and cannot collide with any OPC UA browse name.

      Example:
        propertyValues:
          di:ParameterSet:
            Temperature:
              $value: 23.5
              ua:EURange: [0, 100]
              ua:EngineeringUnits: "°C"
          di:SerialNumber: SN1234
    type: object
    additionalProperties:
      $ref: "#/$defs/PropertyValueContent"

  PropertyValueContent:
    description: >
      The content of a property value entry. Determined by type:
        - string/number/boolean → leaf value
        - array → array of primitives or structured data objects
        - object → nested sub-properties (recurse)

      When the object is a Variable with sub-properties, the
      reserved key `$value` holds the variable's own value.
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: array
      - type: "null"
      - type: object
        additionalProperties:
          $ref: "#/$defs/PropertyValueContent"
  
  WithPropertyValues:
    type: object
    properties:
      propertyValues:
        $ref: "#/$defs/PropertyValues"


  # Variable initializes
  Initializer:
    type: object
    additionalProperties: false
    required:
      - variable
      - value
    properties:
      variable:
        type: string
      value:
        $ref: "#/$defs/PropertyValueContent"
      engineeringUnits:
        $ref: "#/$defs/UnitRef"
      range:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
      description:
        description: >
          The Description attribute of the Variable the initializer writes to
          (every OPC UA node has one); it replaces the one the type gave it.
        type: string

  StateMachine:
    type: object
    additionalProperties: false
    required: [browseName, states, transitions]
    ## Typing only for the keys shared with other types; the whitelist below
    ## is what closes the entry.
    allOf:
      - $ref: "#/$defs/WithDocumentation"
      - $ref: "#/$defs/WithReferences"
    properties:
      documentation: true
      specRef: true
      # extra references, as on any type: the reverse writes the HasCause from a
      # transition to the method that causes it here (OPC 40010 Robotics, PackML, ...)
      references: true
      # one GeneratesEvent reference per entry, as on an ObjectType.
      # Not via EventGenerator: that would bring eventSources/eventSourceOf too.
      generatedEvents:
        description: the Event types this state machine generates (GeneratesEvent references)
        type: array
        items:
          type: string
      properties:
        description: VariableForType - the state machine's own properties, referenced by "HasProperty".
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/VariableForType"
      promotedToMandatory: 
        $ref: "#/$defs/PromotedToMandatoryInner" 
      browseName:
        $ref: "#/$defs/BrowseName"
      displayName:
        type: string
      description:
        type: string
      rolePermissions:
        $ref: "#/$defs/RolePermissions"
      permissionSet:
        description: The name of a permissionSets entry, in place of rolePermissions and accessRestrictions.
        type: string
      accessRestrictions:
        $ref: "#/$defs/AccessRestrictions"
      nodeId:
        type: string
      subtypeOf:
        description: the StateMachine that this StateMachine is derived from
        $ref: "#/$defs/BaseTypeRef"
      isAbstract:
        type: boolean
        default: false
      transitionHaveEffect:
        description: the EventType raised every time a StateMachine transition happens
        $ref: "#/$defs/BrowseName"
      components:
        description: VariableOrObjectForType - contains the list of child components of this object, referenced by a  "HasComponent" relationship.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/VariableOrObjectForType"
      methods:
        description: |
          MethodForType - the methods this state machine exposes. A state machine
          commonly has them: OPC 10000-16 gives the ProgramStateMachine Halt, Reset,
          Resume, Start and Suspend, and OPC 30500 LADS declares the same shape.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/MethodForType"
      states:
        description: |
          a array of machine states, either as bare names or as {name, value} entries.

          anyOf, not oneOf: an empty array satisfies both forms, and "exactly one"
          then rejects it. OPC 30500 LADS has three such state machines
          (ControlFunctionStateMachineType, FunctionalUnitStateMachineType,
          LADSOperationModeStateMachineType), which inherit their states.
        anyOf:
          - type: array
            items:
              $ref: "#/$defs/BrowseName"
          - type: array
            items:
              type: object
              description: a State
              additionalProperties: false
              required:
                - name
                - value
              properties:
                name:
                  $ref: "#/$defs/BrowseName"
                value:
                  type: number
                description:
                  type: string
                isInitialState:
                  type: boolean
      
      transitions:
        type: array
        items:
          type: object
          description: a Transition
          additionalProperties: false
          required:
            - from
            - to
            # - value ( not required can be automatically generated from the index of the transition in the transitions array)
          properties:
            value:
              type: number
            browseName:
              $ref: "#/$defs/BrowseName"
              description: |
                The browse name of the transition.

                If not specified, the name will have a default value build from the From State and the To State browse names
                in the form: [FromState.browseName]To<ToState.browseName>.
            from:
              $ref: "#/$defs/TransitionState"
            to:
              $ref: "#/$defs/TransitionState"
            description:
              type: string

  TransitionState:
    description: |
      The state a transition leaves (from) or enters (to).

      A bare name is a state of this state machine: `Preoperational`.

      `<StateMachineType>.<State>` is a state of another state machine type, which is how a
      transition enters or leaves a state of a sub state machine:
      `VisionAutomaticModeStateMachineType.Initialized` (OPC 40100-1 MachineVision). The type
      takes a namespace alias when it belongs to another namespace (`mv:SomeType.Ready`) and
      must be declared before this state machine.
    anyOf:
      - $ref: "#/$defs/BrowseName"
      - type: string
        pattern: "^([A-Za-z0-9]+:)?[A-Z][a-zA-Z0-9]*\\.[A-Z][a-zA-Z0-9]*$"

