--- ## -----------------------------
# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
$id: https://opcua-modeler.doc.sterfive.com/nodeset2.schema.json
$schema: https://json-schema.org/draft/2020-12/schema#
title: NodeSet2 Schema
description: a schema for human friendly nodeset2
type: object
required: [namespaceUri]
additionalProperties: false
properties:
  ## -----------------------------
  documentation:
    type: object
    properties:
      header:
        description: >
          arbitrary markdown or pandoc header that will be added on top of the document page.
          for instance
               
               header:|
               -----------------------------
               $author: $AUTHOR$
               title:  My Grinder Model
               subtitle: A wonderful model of my OPCUA based coffee grinder
               logo1: ./image1.png
               copyright: copyright joe doe (c)
               -----------------------------
          or 
                 header: 
                   title: My Grinder Model
                   logo1: ./image2.png
                   namespaceUri: ${namespaceUri}
                   publicationDate: ${publicationDate}


          the following inline tags ${namespaceUri} ${version} ${publicationDate} ${namespaces} ${author}
          will be replaced by the corresponding value 
    
        oneOf: 
          - type: string
          - type: object
            
      author:
        description: >
          optional author or list of authors
        oneOf:
          - type: string
          - type: array
            minItems: 1
            items: true

      title:
        description: a short string that describe the model
        type: string
      description:
        description: a markdown string that contains the description of the model
        type: string
      # subtitle: 
      #   description: subtitle 
      #   type: string
      # logo1: 
      #   type: string
      # logo2: 
      #   type: string
      # mainImage: 
      #   description: the url of the main image on the first page of the documentation
      #   type: string
      # copyright:
      #   description: the copyright information that will be displayed at the buttom of each page
      #   type: string
      options:
        type: object
        additionalProperties: false
        description: various options that control the generation of the markdown files.
        properties:
          diagrams:
            type: object
            additionalProperties: false
            description: options that control the generation of the OPCUA Diagrams.
            properties:
              showSubType: 
               description: set to true, so a Type OPCUA hierachy diagram also show derived (subtype) Types.
               type: boolean
              imageSuffix:
                type: string
                description: |
                  specify the text that will be injected after the markdown image link of the OPCUA Diagram.
                  This could be useful to control the size of the image in the product documentation

                  default value: ""

                  example

                  suffix: "{ width: 66%}"
    additionalProperties: false

  ## -----------------------------
  profile:
    type: string
    enum: [self-contained]
    description: >
      Declares the self-contained profile: the file is a YAML stream whose first document is this model and whose
      following documents carry the symbol table and the dependency declarations (see specification/self-contained-profile.md).
  namespaceUri:
    description: |
      The namespace URI of the Namespace described in this document.

      The format should be a url address which contains the domain of your company and the topic of the model.

      For instance : 

          http://acme.com/UA/TemperatureSensor/

    type: string
    # format: uri # uri-reference

  ## -----------------------------
  version:
    type: string
    default: 1.0.0
    description: |
      the version of this namespace e.g 1.0.0.

  ## -----------------------------
  publicationDate:
    type: string
    format: iso-date-time
    default: 2020-01-01T00:00:00.000Z
    description: |
      the publication date of this OPCUA Nodeset2 model in RFC3399 format YY-MM-DDTHH:MM:SSZ

  namespaces:
    description: |
      contains a list of external namespaces that this Namespace is referring to.
      Note that the order is important. Make sure that dependant namespaces are loaded first.
      For instance (`adi` depends on `di` so `di` must be loaded before `adi`).

      example:

            - di
            - adi

    type: array
    uniqueItems: true
    items:
      oneOf:
        - $ref: "#/$defs/NamespaceImportShort"
          description: the namespace alias amongst the predefined values [ di, adi, cnc, vision, machinery etc ...]

  imports:
    type: array
    description: |
      nodeset models this document imports - each declares the model's
      namespace `uri`, the `alias` its nodes are referenced by, and the
      `filename` of the NodeSet2.xml, relative to this file.

      @example:

           - uri: https://acme.com/UA/TemperatureSensor/
             alias: ts
             filename: ../temperature_sensor.nodeset2.xml
    uniqueItems: true
    items:
      oneOf:
        - $ref: "#/$defs/NamespaceImport"
          description: the complete definition of a namespace import

  outputBinaryTypeDictionary:
    description: |
      By default the generated model will conform to the OPC UA 1.04.
      This flag, when set to true, indicates that the model will be compatible with OPC UA 1.03.
      The generator will produce the old TypeDictionary Entry ( from 1.03) which are no longer needed in 1.04.

    type: boolean
    default: false

  typeDictionaryName:
    description: |
      With outputBinaryTypeDictionary: the browse name of the two legacy type dictionaries
      (under OPC Binary and XML Schema). The OPC Foundation's ModelCompiler names them
      TypeDictionary, the default; older NodeSets name them after the model (Opc.Ua.Di,
      AutoID), and a model reversed from one keeps that name so that its NodeIds survive.
    type: string
    minLength: 1

  xmlTypeDictionaryName:
    description: |
      With outputBinaryTypeDictionary: the browse name of the legacy XML Schema dictionary,
      when it differs from typeDictionaryName (OPC 10000-81 UAFX Data names its binary
      dictionary Opc.Ua.Fx and its XML one Opc.Ua.FX). Defaults to typeDictionaryName.
    type: string
    minLength: 1

  ## -----------------------------
  lint:
    description: |
      Control conformance-rule severity per document. This block is the
      authoritative source of suppressions and severity overrides that must
      be co-versioned with this YAML model — typically used for vendor /
      companion-spec nodesets that intentionally violate a Sterfive
      conformance rule. For everyday muting, prefer the CLI flags
      (`--silence`, `--rule`, `--strict`, `--style`, `--quiet`) or the
      Y2M_QUIET / Y2M_STRICT / Y2M_STYLE environment variables.

      `silence:` drops the listed diagnostic codes (or code prefixes) entirely.
      `error:`   escalates the listed codes from warning to error.

      example:
        lint:
          silence: [DSL-W-NAMING-006]   # this companion spec uses Foo*Type enums
          error:   [DSL-W-COMPAT-001]   # this repo treats compat regressions as errors

    type: object
    additionalProperties: false
    properties:
      silence:
        type: array
        items:
          type: string
      error:
        type: array
        items:
          type: string

  objectTypes:
    description: this section contains all object types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/ObjectType"

  variableTypes:
    description: this section contains all variable types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/VariableType"

  stateMachines:
    description: this section contains all state machines
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/StateMachine"

  dataTypes:
    description: this section contains all data types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/DataType"

  referenceTypes:
    description: this section contains all reference types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/ReferenceType"

  interfaceTypes:
    description: this section contains all interface types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/ObjectType"

  eventTypes:
    description: this section contains all event types defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/ObjectType"

  instances:
    description: this section contains the definition of all the object instances defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Instance"

  objects:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Object"

  references:
    description: this section contains a list of additional semantics reference between nodes defined in the model.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Reference"

  initializers:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Initializer"

  namespaceMetadatas:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Object"

  permissionSets:
    description: |
      Named { rolePermissions, accessRestrictions } that a node takes with
      permissionSet: <name>, for combinations several nodes share. A node uses a set or
      writes the keys itself, not both.
    type: object
    additionalProperties:
      $ref: "#/$defs/PermissionSet"

  roles:
    description: |
      Roles of this model: instances of RoleType under the server's RoleSet. Each gets the
      configuration members (Identities, the Applications and Endpoints lists, the methods
      that edit them), locked to SecurityAdmin with a signed and encrypted channel, as the
      published NodeSets build theirs. Grant a role permissions on other nodes with
      rolePermissions: [{ role: <its browseName>, permissions: [...] }].
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Role"

$defs:
  NamespaceImport:
    type: object
    description: |
      An external NodeSet2.xml this model depends on.

      Identity-first: `uri` (with optional `publicationDate`) says WHAT is
      needed and means the same thing on every machine; `filename` only says
      where to look first, and is verified against the file actually loaded.
      Give at least one of the two. `filename` on its own stays fully
      supported — air-gapped setups legitimately pin an exact path.
    required: [alias]
    anyOf:
      - required: [uri]
      - required: [filename]
    properties:
      alias:
        description: |
          the alias (short name) of the imported namespace.
          The alias will be used when defining browse names or browse path.
          For example: (with alias `di`)
               di:DeviceHeathEnumeration
        type: string
      uri:
        description: |
          The namespace URI the nodeset declares as its ModelUri. This is the
          identity: it resolves the same way locally, in the SaaS, and offline.
        type: string
      filename:
        description: |
          Path to the NodeSet2.xml, resolved relative to this document. A hint,
          not the identity — if it is missing or stale and a `uri` is given,
          resolution falls back to matching the namespace URI.
        type: string
      publicationDate:
        description: |
          Require a nodeset published on or after this date. This is OPC UA's
          own compatibility rule (PublicationDate >= required), not a semver
          range — version strings in nodesets are labels, not ordered values.
        type: string
      sha256:
        description: Optional integrity pin - the sha256 of the exact file expected.
        type: string
  NamespaceImportShort:
    description: a list of predefined namespace alias for well-known companion specs.
    enum:
    - adi
    - amb
    - autoId
    - cnc
    - commercialKitchenEquipment
    - di
    - eumabois
